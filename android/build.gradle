buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'  // ★ تغيير من 8.6.0 إلى 8.9.1
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20"  // ★ تغيير من 2.0.0 إلى 2.2.20
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
